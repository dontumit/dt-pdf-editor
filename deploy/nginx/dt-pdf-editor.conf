# ============================================================
# Nginx reverse proxy สำหรับ DT PDF Editor
# ปรับ server_name และ path ของใบรับรองให้ตรงกับระบบของคุณ
# ============================================================

# จำกัดอัตราคำขอชั้นนอกสุด ป้องกันการยิงถล่ม (ระบบมี rate limit ในแอปอีกชั้น)
limit_req_zone $binary_remote_addr zone=dtpdf_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dtpdf_upload:10m rate=2r/s;

upstream dtpdf_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # เปลี่ยนเส้นทางไป HTTPS ทั้งหมด ยกเว้นการตรวจสอบใบรับรอง
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pdf.example.ac.th;   # <-- แก้เป็นโดเมนของคุณ

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ขนาดไฟล์อัปโหลดสูงสุด ต้องไม่น้อยกว่า MAX_FILE_SIZE_MB ในไฟล์ .env
    client_max_body_size 120m;
    client_body_timeout  300s;

    # การบีบอัด (ไม่บีบไฟล์ที่บีบมาแล้ว เช่น PDF/รูปภาพ)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/ttf;

    # ---------- ไฟล์คงที่: แคชยาว เพราะมี ?v= กำกับเวอร์ชัน ----------
    location ~* ^/assets/(vendor|fonts|icons)/ {
        proxy_pass http://dtpdf_app;
        proxy_cache_valid 200 30d;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- ไฟล์ของผู้ใช้: ห้ามแคชเด็ดขาด ----------
    location ~* ^/(api/files|s)/ {
        proxy_pass http://dtpdf_app;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        expires off;
    }

    # ---------- อัปโหลดไฟล์: จำกัดอัตราเข้มกว่าปกติ ----------
    location = /api/jobs/server {
        limit_req zone=dtpdf_upload burst=5 nodelay;
        proxy_pass http://dtpdf_app;
        proxy_request_buffering off;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    location /api/ {
        limit_req zone=dtpdf_api burst=40 nodelay;
        proxy_pass http://dtpdf_app;
    }

    location / {
        proxy_pass http://dtpdf_app;
    }

    # ค่า proxy ร่วมสำหรับทุก location
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;
}
